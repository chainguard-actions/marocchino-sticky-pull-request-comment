name: Test ignore_empty - no message provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          number: 1
          ignore_empty: "true"
          # No message or path provided — action should skip gracefully

      - name: Assert action handled missing message gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly with ignore_empty=true and no message"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or missing message)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
