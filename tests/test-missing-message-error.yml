name: Test missing message causes validation error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No message or path provided, ignore_empty=false (default)
        # number_force=1 to get past the PR number check so body validation runs
        # The action should call core.setFailed("Either message or path input is required")
        with:
          number_force: "1"
        continue-on-error: true
      - name: Assert action failed due to missing message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing message, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no message or path was provided"
