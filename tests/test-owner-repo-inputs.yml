name: Test owner and repo inputs (cross-repo targeting)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: "marocchino"
          repo: "sticky-pull-request-comment"
          number: "1"
          message: "Test comment via owner/repo inputs"
          only_update: "true"
          ignore_empty: "true"
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may skip (success) or fail because the token may not have
          # write access to the target repo, or the PR may not exist.
          # Either way, the owner and repo inputs were exercised.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with owner/repo inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
