name: Test sticky PR comment from file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create comment file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          echo "Comment loaded from a file path." > "$GITHUB_WORKSPACE/tests/fixtures/comment.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          number: 1
          path: "tests/fixtures/comment.txt"
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CREATED_ID: ${{ steps.action.outputs.created_comment_id }}
          PREVIOUS_ID: ${{ steps.action.outputs.previous_comment_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "created_comment_id: $CREATED_ID"
          echo "previous_comment_id: $PREVIOUS_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (path mode)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
