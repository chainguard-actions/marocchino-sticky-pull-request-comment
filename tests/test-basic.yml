name: Test basic usage - post a comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          number: 1
          message: "Hello from sticky-pull-request-comment test!"

      - name: Assert action ran and handled sentinel repo gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CREATED: ${{ steps.action.outputs.created_comment_id }}
          PREVIOUS: ${{ steps.action.outputs.previous_comment_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "created_comment_id: $CREATED"
          echo "previous_comment_id: $PREVIOUS"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded (real repo context)"
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
