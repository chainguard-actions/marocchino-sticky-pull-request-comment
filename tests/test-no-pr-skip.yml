name: Test no PR number skips gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          message: "Hello from test"
          # No number or number_force provided; workflow_dispatch has no PR context
          # The action should log "no pull request numbers given: skip step" and exit 0
      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully (skipped due to no PR number)"
          echo "PASS"
