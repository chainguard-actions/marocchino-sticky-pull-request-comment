name: Test sticky PR comment with owner and repo inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "Test comment with explicit owner and repo"
          number: 1
          owner: octocat
          repo: Hello-World
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (owner/repo inputs accepted, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CREATED: ${{ steps.action.outputs.created_comment_id }}
          PREVIOUS: ${{ steps.action.outputs.previous_comment_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "created_comment_id: $CREATED"
          echo "previous_comment_id: $PREVIOUS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with owner and repo inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cross-repo API call not resolvable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
