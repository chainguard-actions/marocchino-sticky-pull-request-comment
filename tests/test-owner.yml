name: Test owner input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          owner: octocat
          number: "1"
          message: "Test comment from owner input test"
      - name: Assert action ran (owner input accepted, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CREATED: ${{ steps.action.outputs.created_comment_id }}
          PREVIOUS: ${{ steps.action.outputs.previous_comment_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "created_comment_id: $CREATED"
          echo "previous_comment_id: $PREVIOUS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with owner input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / non-existent PR is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
